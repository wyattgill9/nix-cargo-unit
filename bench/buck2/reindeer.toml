##
## Reindeer config for the buck2 bench.
##
## Paths here are relative to this file's directory (`bench/buck2/`), except
## `fixups/`, which reindeer always resolves under `third_party_dir`. Hence the
## `bench/fixups` symlink back into this directory.
##

# The workspace under test: the same submodule the nix-cargo-unit bench builds,
# unmodified. Reindeer reads its Cargo.toml/Cargo.lock and buckifies the whole
# resolve.
manifest_path = "../rust-analyzer/Cargo.toml"

# Where the generated BUCK file goes, and the root every path inside it is
# relative to. `bench/` — one level above this file — because a buck2 target's
# sources must live under its own package, and rust-analyzer/ is a sibling of
# buck2/, so only a package at bench/ can name both it and the vendored crates.
third_party_dir = ".."

# The point of the exercise: rust-analyzer's own 42 crates become buck2 targets
# too, not just its ~211 dependencies. Off by default because the usual reindeer
# job is a third-party directory, whose members are somebody else's problem.
include_workspace_members = true

# No `vendor/`: each crate becomes an `http_archive` fetched from static.crates.io
# and cached by buck2. `reindeer vendor` is not part of the workflow here.
vendor = false

# `srcs` as an explicit file list instead of `glob(["**/*.rs"])`. Slower to
# generate, but a source file added or removed then shows up as a BUCK diff
# rather than silently changing what a target compiles.
precise_srcs = true

# rust-analyzer's crates read CARGO_PKG_* at compile time (`version.rs` and
# friends); without these the affected crates fail to compile rather than
# misreport.
cargo_env = true

[buck]
file_name = "BUCK"

# Reindeer emits abstract rule names; these are the prelude macros they resolve
# to. `cargo.*` caps lints on generated targets, which is what this bench wants:
# it measures build time, not rust-analyzer's lint cleanliness.
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"

# Not `alias`: reindeer's unversioned public aliases have no consumer here and
# two of them collide. See macros/reindeer.bzl.
alias = "omit_alias"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
load("//buck2/macros:reindeer.bzl", "omit_alias")
"""

generated_file_header = """
##
## @generated by `reindeer -c bench/buck2/reindeer.toml buckify`
## Do not edit by hand.
##
## This file lives here, and not in `bench/buck2/`, because a buck2 target's
## sources must be under its own package and `rust-analyzer/` is a sibling of
## `buck2/`. See `bench/buck2/README.md`.
##
"""
